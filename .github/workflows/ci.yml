name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
  qiskit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qubit_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: qubit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qubit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QQ_TEST_POSTGRES_URL: postgresql://qubit_test:test_only_password@localhost:5432/qubit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r services/api/requirements.lock.txt
      - run: python -m pytest services/api -q
